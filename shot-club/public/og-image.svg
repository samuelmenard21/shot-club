<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#07090f"/>
      <stop offset="100%" stop-color="#0c1220"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Left side: branding + messaging -->
  <text x="68" y="100" font-family="'Barlow Condensed', 'Arial Narrow', Arial, sans-serif" font-weight="800" font-size="18" fill="#2979ff" letter-spacing="3" opacity="0.9">HOCKEY SHOT CHALLENGE</text>

  <text x="68" y="200" font-family="'Barlow Condensed', 'Arial Narrow', Arial, sans-serif" font-weight="800" font-size="72" fill="white" letter-spacing="-1" line-height="1">Track</text>
  <text x="68" y="270" font-family="'Barlow Condensed', 'Arial Narrow', Arial, sans-serif" font-weight="800" font-size="72" fill="white" letter-spacing="-1">shots.</text>
  <text x="68" y="360" font-family="'Barlow Condensed', 'Arial Narrow', Arial, sans-serif" font-weight="800" font-size="72" fill="#3dd68c" letter-spacing="-1" filter="url(#glow)">Climb the</text>
  <text x="68" y="430" font-family="'Barlow Condensed', 'Arial Narrow', Arial, sans-serif" font-weight="800" font-size="72" fill="#3dd68c" letter-spacing="-1" filter="url(#glow)">rankings.</text>

  <text x="68" y="530" font-family="'Barlow', Arial, sans-serif" font-weight="400" font-size="22" fill="#4a6080">Pick your challenge</text>
  <text x="68" y="560" font-family="'Barlow', Arial, sans-serif" font-weight="400" font-size="22" fill="#4a6080">Free for all ages</text>

  <!-- Right side: Challenge tiers -->
  <g>
    <!-- Title -->
    <text x="900" y="90" font-family="'Barlow Condensed', 'Arial Narrow', Arial, sans-serif" font-weight="700" font-size="17" fill="white" letter-spacing="1" text-anchor="middle">CHOOSE YOUR CHALLENGE</text>

    <!-- Rookie Card -->
    <rect x="670" y="135" width="110" height="130" rx="12" fill="#0f1623" stroke="#3a5a2d" stroke-width="2"/>
    <text x="725" y="165" font-family="'Barlow', Arial, sans-serif" font-weight="700" font-size="13" fill="#6ee7b7" text-anchor="middle" letter-spacing="0.5">ROOKIE</text>
    <text x="725" y="200" font-family="'Barlow Condensed', 'Arial Narrow', Arial, sans-serif" font-weight="900" font-size="28" fill="white" text-anchor="middle">1,000</text>
    <text x="725" y="220" font-family="'Barlow', Arial, sans-serif" font-weight="500" font-size="11" fill="#4a6080" text-anchor="middle">shots</text>
    <text x="725" y="240" font-family="'Barlow', Arial, sans-serif" font-weight="400" font-size="11" fill="#3a6d5a" text-anchor="middle">67 shots/day</text>

    <!-- Pro Card -->
    <rect x="815" y="120" width="110" height="160" rx="12" fill="#0f1623" stroke="#d97706" stroke-width="2"/>
    <text x="870" y="155" font-family="'Barlow', Arial, sans-serif" font-weight="700" font-size="13" fill="#fbbf24" text-anchor="middle" letter-spacing="0.5">PRO</text>
    <text x="870" y="195" font-family="'Barlow Condensed', 'Arial Narrow', Arial, sans-serif" font-weight="900" font-size="32" fill="white" text-anchor="middle">2,500</text>
    <text x="870" y="220" font-family="'Barlow', Arial, sans-serif" font-weight="500" font-size="11" fill="#4a6080" text-anchor="middle">shots</text>
    <text x="870" y="240" font-family="'Barlow', Arial, sans-serif" font-weight="400" font-size="11" fill="#a76a0a" text-anchor="middle">125 shots/day</text>

    <!-- Elite Card -->
    <rect x="960" y="105" width="110" height="175" rx="12" fill="#0f1623" stroke="#0ea5e9" stroke-width="2"/>
    <text x="1015" y="145" font-family="'Barlow', Arial, sans-serif" font-weight="700" font-size="13" fill="#67e8f9" text-anchor="middle" letter-spacing="0.5">ELITE</text>
    <text x="1015" y="190" font-family="'Barlow Condensed', 'Arial Narrow', Arial, sans-serif" font-weight="900" font-size="32" fill="white" text-anchor="middle">5,000</text>
    <text x="1015" y="215" font-family="'Barlow', Arial, sans-serif" font-weight="500" font-size="11" fill="#4a6080" text-anchor="middle">shots</text>
    <text x="1015" y="235" font-family="'Barlow', Arial, sans-serif" font-weight="400" font-size="11" fill="#0a5a78" text-anchor="middle">143 shots/day</text>

    <!-- Hall of Famer Card -->
    <rect x="1105" y="90" width="110" height="190" rx="12" fill="#0f1623" stroke="#d4af6a" stroke-width="2"/>
    <text x="1160" y="130" font-family="'Barlow', Arial, sans-serif" font-weight="700" font-size="12" fill="#d4af6a" text-anchor="middle" letter-spacing="0.5">HALL OF</text>
    <text x="1160" y="145" font-family="'Barlow', Arial, sans-serif" font-weight="700" font-size="12" fill="#d4af6a" text-anchor="middle" letter-spacing="0.5">FAMER</text>
    <text x="1160" y="185" font-family="'Barlow Condensed', 'Arial Narrow', Arial, sans-serif" font-weight="900" font-size="32" fill="white" text-anchor="middle">10,000</text>
    <text x="1160" y="210" font-family="'Barlow', Arial, sans-serif" font-weight="500" font-size="11" fill="#4a6080" text-anchor="middle">shots</text>
    <text x="1160" y="230" font-family="'Barlow', Arial, sans-serif" font-weight="400" font-size="11" fill="#6d5a2a" text-anchor="middle">286 shots/day</text>

    <!-- Bottom text -->
    <text x="900" y="340" font-family="'Barlow', Arial, sans-serif" font-weight="700" font-size="13" fill="white" text-anchor="middle" letter-spacing="1">HOW IT WORKS</text>
    <text x="900" y="365" font-family="'Barlow', Arial, sans-serif" font-weight="500" font-size="12" fill="#c8d8f0" text-anchor="middle">🎯 Log shots in 5 seconds</text>
    <text x="900" y="388" font-family="'Barlow', Arial, sans-serif" font-weight="500" font-size="12" fill="#c8d8f0" text-anchor="middle">📈 Track progress instantly</text>
    <text x="900" y="411" font-family="'Barlow', Arial, sans-serif" font-weight="500" font-size="12" fill="#c8d8f0" text-anchor="middle">🏅 Earn ranks &amp; streaks</text>

    <!-- Bottom -->
    <text x="900" y="555" font-family="'Barlow', Arial, sans-serif" font-weight="400" font-size="12" fill="#2d3f5a" text-anchor="middle">Free for all ages · No app to download</text>
  </g>
</svg>
