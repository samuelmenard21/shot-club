<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#080b13"/>
      <stop offset="100%" stop-color="#0d1526"/>
    </linearGradient>
    <linearGradient id="barFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2979ff"/>
      <stop offset="100%" stop-color="#67e8f9"/>
    </linearGradient>
    <linearGradient id="puckGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3dd68c"/>
      <stop offset="100%" stop-color="#2979ff"/>
    </linearGradient>
    <radialGradient id="vignette" cx="75%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#1a2847" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#1a2847" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#vignette)"/>

  <!-- Subtle rink-line accent -->
  <circle cx="1060" cy="130" r="220" fill="none" stroke="#1c2b4a" stroke-width="1.5" opacity="0.5"/>
  <circle cx="1060" cy="130" r="220" fill="url(#puckGlow)" opacity="0.05" filter="url(#soft)"/>

  <!-- Eyebrow -->
  <text x="80" y="118" font-family="'Barlow Condensed','Arial Narrow',Arial,sans-serif" font-weight="800" font-size="17" fill="#5b9dff" letter-spacing="4">HOCKEY SHOT CHALLENGE</text>

  <!-- Headline -->
  <text x="78" y="230" font-family="'Barlow Condensed','Arial Narrow',Arial,sans-serif" font-weight="800" font-size="86" fill="white" letter-spacing="-1.5">Shoot more.</text>
  <text x="78" y="322" font-family="'Barlow Condensed','Arial Narrow',Arial,sans-serif" font-weight="800" font-size="86" letter-spacing="-1.5">
    <tspan fill="#3dd68c">Track</tspan><tspan fill="white"> it.</tspan>
  </text>

  <!-- Subhead -->
  <text x="80" y="378" font-family="'Barlow',Arial,sans-serif" font-weight="400" font-size="24" fill="#8fa3c4">Pick a shot challenge and watch your progress</text>
  <text x="80" y="410" font-family="'Barlow',Arial,sans-serif" font-weight="400" font-size="24" fill="#8fa3c4">build, day after day.</text>

  <!-- Pill CTA -->
  <rect x="80" y="452" width="230" height="56" rx="28" fill="#2979ff"/>
  <text x="195" y="487" font-family="'Barlow Condensed','Arial Narrow',Arial,sans-serif" font-weight="700" font-size="20" fill="white" text-anchor="middle" letter-spacing="0.5">START A CHALLENGE</text>

  <text x="80" y="548" font-family="'Barlow',Arial,sans-serif" font-weight="500" font-size="16" fill="#4a6080">Free · No app to download · Ages 6&#8211;18</text>

  <!-- Right: challenge ladder -->
  <g font-family="'Barlow',Arial,sans-serif">
    <!-- Rookie -->
    <rect x="700" y="392" width="230" height="46" rx="10" fill="#101a2e" stroke="#22345a" stroke-width="1"/>
    <rect x="700" y="392" width="72" height="46" rx="10" fill="url(#barFill)" opacity="0.85"/>
    <text x="722" y="421" font-family="'Barlow Condensed','Arial Narrow',Arial,sans-serif" font-weight="800" font-size="15" fill="white" letter-spacing="0.5">ROOKIE</text>
    <text x="912" y="421" font-family="'Barlow Condensed','Arial Narrow',Arial,sans-serif" font-weight="800" font-size="20" fill="#dce8fb" text-anchor="end">1,000</text>

    <!-- Pro -->
    <rect x="700" y="336" width="290" height="46" rx="10" fill="#101a2e" stroke="#22345a" stroke-width="1"/>
    <rect x="700" y="336" width="150" height="46" rx="10" fill="url(#barFill)" opacity="0.85"/>
    <text x="722" y="365" font-family="'Barlow Condensed','Arial Narrow',Arial,sans-serif" font-weight="800" font-size="15" fill="white" letter-spacing="0.5">PRO</text>
    <text x="972" y="365" font-family="'Barlow Condensed','Arial Narrow',Arial,sans-serif" font-weight="800" font-size="20" fill="#dce8fb" text-anchor="end">2,500</text>

    <!-- Elite -->
    <rect x="700" y="280" width="350" height="46" rx="10" fill="#101a2e" stroke="#22345a" stroke-width="1"/>
    <rect x="700" y="280" width="235" height="46" rx="10" fill="url(#barFill)" opacity="0.85"/>
    <text x="722" y="309" font-family="'Barlow Condensed','Arial Narrow',Arial,sans-serif" font-weight="800" font-size="15" fill="white" letter-spacing="0.5">ELITE</text>
    <text x="1032" y="309" font-family="'Barlow Condensed','Arial Narrow',Arial,sans-serif" font-weight="800" font-size="20" fill="#dce8fb" text-anchor="end">5,000</text>

    <!-- Hall of Famer -->
    <rect x="700" y="224" width="410" height="46" rx="10" fill="#101a2e" stroke="#3a3320" stroke-width="1"/>
    <rect x="700" y="224" width="410" height="46" rx="10" fill="#d4af6a" opacity="0.18"/>
    <rect x="700" y="224" width="330" height="46" rx="10" fill="#d4af6a" opacity="0.55"/>
    <text x="722" y="253" font-family="'Barlow Condensed','Arial Narrow',Arial,sans-serif" font-weight="800" font-size="15" fill="white" letter-spacing="0.5">HALL OF FAMER</text>
    <text x="1092" y="253" font-family="'Barlow Condensed','Arial Narrow',Arial,sans-serif" font-weight="800" font-size="20" fill="#fff3da" text-anchor="end">10,000</text>
  </g>

  <text x="700" y="196" font-family="'Barlow Condensed','Arial Narrow',Arial,sans-serif" font-weight="700" font-size="15" fill="#5b7099" letter-spacing="2">CHOOSE YOUR CHALLENGE</text>
</svg>
